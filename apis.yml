apis:
  - name: AdMakeAI REST API
    description: >-
      RPC-style JSON REST API with dot-named tRPC procedure paths (e.g. adGeneration.create) covering ad image and
      UGC video generation, batch ad sets, ad copy, competitor ad research, Meta analytics, and Meta campaign draft
      publishing. POST bodies are JSON; GET inputs go in ?input=<URL-encoded JSON>; responses are wrapped as
      { ok, tool, data }. Authenticated via an x-api-key header (or Authorization: Bearer). Every MCP tool is
      reachable here 1:1. No OpenAPI is published.
    humanURL: https://admakeai.com/agents
    baseURL: https://admakeai.com/api/v1
