  - name: AdMakeAI MCP Server
    description: >-
      Hosted, stateless streamable-HTTP MCP server exposing 65 tools across account, projects, uploads, ad image
      generation, ad copy, ad sets, UGC video, competitor research, Meta publishing and Meta analytics. Authorization
      is OAuth 2.1 with dynamic client registration and PKCE S256 (scopes mcp:read, mcp:write, mcp:publish,
      offline_access, filtered at tools/list) or an account API key. Listed in the official MCP registry as
      com.admakeai/admakeai. Works with Claude Code/Desktop, Cursor, VS Code/Copilot, Windsurf, Codex, Gemini CLI,
      and Cline.
    humanURL: https://admakeai.com/agents
