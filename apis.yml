name: AdMakeAI
description: >-
  AI ad-creative platform for Meta, Instagram, and TikTok that turns product photos or prompts into finished ad images
  and UGC-style video ads, batch-generates ad-set variations, generates ad copy, researches competitor ads from the
  Meta Ad Library, reads Meta campaign analytics, and drafts and publishes campaigns through the official Meta
  Marketing API. Its machine-readable contract is not an OpenAPI: AdMakeAI is a tRPC application projected two ways,
  as a hosted streamable-HTTP MCP server at /api/mcp and as 1:1 REST procedure paths at /api/v1, both bound to one
  account and one credit pool. It implements the full MCP authorization stack (RFC 8414, RFC 9728, RFC 7591, PKCE
  S256) with three scopes filtered at tools/list, publishes an llms.txt, an MCP server card and an agent-skills index
  under /.well-known/, and ships a first-party Agent Skill for coding agents.
