note: >-
  admakeai.com sits behind a Cloudflare managed challenge that answers HTTP 403 for every HTML path — including paths
  that do not exist — but the /.well-known/ prefix and /llms.txt and /robots.txt are exempted and answer normally.
  Every 404 below is therefore a genuine application 404 (a 22,813-byte Next.js not-found page), not a bot block.
  Two of the 200s are non-standard paths the provider invented: /.well-known/mcp.json (an MCP server card) and
  /.well-known/agent-skills.json (an agentskills.io v1 index). Both carry real documents and both are referenced from
  /llms.txt, so they are recorded as served discovery surfaces.
