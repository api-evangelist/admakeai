- name: adGeneration__create
  group: Ad image generation
  kind: write
  description: 'Queue a FINISHED AD image render. Required: projectId. Call adResearch.listProjects first and pick the project
    the request is about, or ask the user when it is ambiguous; never guess an id. Also required: prompt, a creative brief
    rather than a finished image prompt. How the prompt is used: a creative-director model rewrites it into the real image
    prompt using the project''s brand brief, and that rewrite always adds a specific headline, a subline, a CTA button, and
    the project logo when the project has one. Negative instructions in the prompt (''no text'', ''no logo'', ''nothing but
    the product'') cannot suppress those; use adGeneration.generateImage when the caller wants exact or no text. Optional:
    adType, aspectRatio, quality (low/high/ultra), referenceImageUrls, inputImageId (from upload.uploadImageBase64), referenceAdId
    or referenceInspirationId to remix an existing ad. Costs credits. Returns a generation ID. Poll adGeneration.getById until
    status is COMPLETED.'
  rest: https://admakeai.com/api/v1/adGeneration.create
  in_server_card: true
  input_properties:
  - adSetId
  - adType
  - aspectRatio
  - inputImageId
  - projectId
  - prompt
  - quality
  - referenceAdId
  - referenceImageUrls
  - referenceInspirationId
  required:
  - projectId
  - prompt
- name: adGeneration__generateImage
  group: Ad image generation
  kind: write
  description: 'Queue an image render from a VERBATIM prompt. The prompt goes to the image model exactly as written: no creative-director
    rewrite, no brand brief, no added headline, subline or CTA, and no project logo. The image contains only what the prompt
    stipulates. Use this when the caller wants only specific stipulated text, forbids text/logos/CTAs, or wants raw scene,
    product, or photography imagery rather than a finished ad; use adGeneration.create for finished ads. Required: projectId
    (credit scoping only, nothing from it enters the prompt) and prompt. Optional: aspectRatio, quality (low/high/ultra),
    referenceImageUrls and inputImageId for image-to-image. Costs the same credits as adGeneration.create. Returns a generation
    ID. Poll adGeneration.getById until status is COMPLETED.'
  rest: https://admakeai.com/api/v1/adGeneration.generateImage
  in_server_card: false
  input_properties:
  - aspectRatio
  - inputImageId
  - projectId
  - prompt
  - quality
  - referenceImageUrls
  required:
  - projectId
  - prompt
- name: adGeneration__edit
  group: Ad image generation
  kind: write
  description: 'Queue an image-to-image edit and return immediately. The universal edit tool: change background, restyle,
    swap a subject, change aspect ratio, add brand assets, or remix a competitor ad. Source is either sourceAdId (one of the
    user''s own generations) or sourceImageUrl (any direct image URL). Costs credits. Poll adGeneration.getById until COMPLETED.'
  rest: https://admakeai.com/api/v1/adGeneration.edit
