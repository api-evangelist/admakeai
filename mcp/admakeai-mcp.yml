- finding: live-tools-list-unreadable-anonymously
  detail: 'POST tools/list to https://admakeai.com/api/mcp returns HTTP 403 with a Cloudflare managed challenge (cf-mitigated:
    challenge), not an MCP 401/WWW-Authenticate. The live schema could not be introspected anonymously; the tool set below
    is read from the provider-published manifest instead.'
  probed: '2026-08-11'
  http_status: 403
- finding: skill-repo-link-404
  detail: Both /llms.txt and /.well-known/mcp.json point agents at https://github.com/admakeai/agent-skills, which returns
    404 (the admakeai GitHub org does not exist). The real repositories live under the personal account github.com/mesmerlord.
  probed: '2026-08-11'
  http_status: 404
- finding: disabled-but-registered-tools
  detail: The six zernioAnalytics pause/resume tools are registered and described but fail closed; the provider directs status
    changes to Meta Ads Manager.
