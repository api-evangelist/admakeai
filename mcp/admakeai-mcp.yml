- finding: tool-count-divergence
  detail: Three published numbers disagree. The MCP server card at /.well-known/mcp.json enumerates 38 tools; the first-party
    plugin manifest (lhm.plugin.json) and the admakeai-mcp README both say 65; the apis.io submission said 59. The 65-tool
    manifest is the only one carrying inputSchema, so it is treated as authoritative here.
