source: mcp/admakeai-mcp.yml (65-tool manifest) + skills/admakeai-api.md ("REST endpoints map 1:1 to MCP tools") + https://github.com/mesmerlord/admakeai-mcp
  README
note: 'AdMakeAI publishes NO OpenAPI. This crosswalk therefore binds each MCP tool to its REST *path*, not to an OpenAPI operationId.
  The binding rule is published by the provider verbatim: "MCP tool name: adGeneration__create -> REST path: /api/v1/adGeneration.create",
  "REST endpoints map 1:1 to MCP tools", and "every tool here is also reachable over plain REST at https://admakeai.com/api/v1/<tool>".
  Nothing here was inferred beyond applying that stated rule.'
surfaces:
  openapi:
    present: false
    note: No OpenAPI/Swagger document found on any host. /openapi.json, /api/openapi.json, /api/v1/openapi.json, /swagger.json,
      /api/docs.json and /api/spec.json all return HTTP 403 (Cloudflare managed challenge, same response as every other HTML
      path including nonexistent ones). /.well-known/openapi.json returns an application 404.
  graphql:
    present: false
  mcp:
    url: https://admakeai.com/api/mcp
    transport: streamable-http
    tools_list_gated: true
    note: Anonymous POST tools/list returns 403 Cloudflare challenge, so the live schema was not introspected; tools and inputSchemas
      come from the first-party plugin manifest instead.
  rest:
    base: https://admakeai.com/api/v1
    style: tRPC procedure paths
    note: POST body is JSON; GET inputs go in ?input=<URL-encoded JSON>; responses are wrapped as {ok, tool, data}. robots.txt
      disallows /api for crawlers.
binding_rule:
  mcp: <namespace>__<procedure>
  rest: https://admakeai.com/api/v1/<namespace>.<procedure>
  published_by_provider: true
