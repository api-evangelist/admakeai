  note: No id prefix scheme is published; ids are opaque strings in every schema.
boundary:
  note: >-
    The graph has two halves that meet only at Upload and CampaignDraft — AdMakeAI-owned objects (Project, AdSet,
    AdGeneration, VideoGeneration, Competitor, ScrapedAd) and Meta-owned objects (ad account, campaign, ad set, ad)
    reached through the Meta Marketing API. Only the Meta half carries live spend consequences.
