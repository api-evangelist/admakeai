note: >-
  AdMakeAI publishes NO request-rate limit and NO rate-limit response headers. What it does publish are two hard
  account-level ceilings plus a credit budget, all enforced as application errors rather than as 429s. An agent
  therefore has no runtime signal to back off on — it can only discover exhaustion by getting a FORBIDDEN error. The
  human API reference at /api/docs returns 403 to non-browser clients, so a documented header scheme cannot be ruled
  out; nothing in the provider's machine-readable surface mentions one.
